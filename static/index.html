<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>电网恢复调度</title>
<style>
body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}
pre{background:#f3f5f7;padding:16px;overflow:auto}
button{padding:8px 14px}
table{border-collapse:collapse;width:100%;margin-top:12px}
th,td{border:1px solid #ccd2d8;padding:6px 10px;text-align:left;font-size:14px;vertical-align:top}
.ok{color:#1a7f37;font-weight:600}.wait{color:#9a6700}.stale{color:#b42318;font-weight:600}
.stuck{color:#b42318}
input{padding:8px}
</style>
<h1>电网事故应急与恢复调度</h1>
<p>停运事件、安全约束恢复计划、重要用户、离线上报合并、停复电凭证、异常遥测隔离和状态发布。</p>
<p><button onclick="loadState()">刷新全局状态</button></p>
<p>查询计划凭证（开工/完工：班组、设备序列、现场时刻与卡住原因）：
<input id="planId" placeholder="计划 ID" size="8">
<button onclick="loadPlan()">查凭证</button></p>
<div id="planView"></div>
<pre id="state">加载中...</pre>
<script>
async function loadState(){state.textContent=JSON.stringify(await (await fetch('/api/state')).json(),null,2)}
const LABEL={awaiting_start:['wait','等待开工'],awaiting_complete:['wait','作业中/未解除'],complete:['ok','已完工解除'],stale:['stale','改版失效'],inactive:['wait','计划未激活']};
function v(v){if(!v)return '—';return `${v.kind==='start'?'开工':'完工'}｜班组 ${v.crew}｜设备 ${v.asset_code}｜现场时刻 ${v.field_time}`;}
async function loadPlan(){
  const id=planId.value.trim(); if(!id)return;
  const d=await (await fetch('/api/plans/'+id)).json();
  if(d.error){planView.innerHTML=`<p class="stuck">${d.error}</p>`;return;}
  const rows=(d.step_vouchers||[]).map(x=>{const [cls,txt]=LABEL[x.status]||['','?'];
    return `<tr><td>${x.step_no}</td><td>${x.asset}</td><td class="${cls}">${txt}</td>
    <td>${v(x.start)}</td><td>${v(x.complete)}</td><td class="stuck">${x.stuck_reason||'—'}</td></tr>`;}).join('');
  const blockers=(d.publish_blockers||[]);
  planView.innerHTML=`<h2>计划 #${d.plan.id}（版本 v${d.plan.version}，状态 ${d.plan.state}）</h2>
    <table><tr><th>步骤</th><th>设备序列</th><th>凭证状态</th><th>开工凭证</th><th>完工凭证</th><th>卡住原因</th></tr>${rows}</table>
    <p class="${blockers.length?'stuck':'ok'}">${blockers.length?('发布恢复完成受阻：'+blockers.join('；')):'发布闸门：每步均有有效完工凭证'}</p>`;
}
loadState()
</script></html>
